# LEADER
vo=gpu-next
hwdec=vaapi
profile=gpu-hq
fullscreen
input-ipc-server=/tmp/mpvsocket
pause
reset-on-next-file=pause
loop-playlist

# Multi-player synchronization (requires mpv-sync.lua script)
# NOTE: Using socat backend (lua-socket incompatible with MPV in Debian 13)
script=~/content/mpv-sync.lua
script-opts=sync-backend=socat,sync-role=leader,sync-target=10.30.70.255:12338,sync-interval=0.5,sync-show_osd=no

#verbose=yes


###############################3

# FOLLOWER
vo=gpu-next
hwdec=vaapi
profile=gpu-hq
fullscreen
input-ipc-server=/tmp/mpvsocket
pause
reset-on-next-file=pause
loop-playlist

# Multi-player synchronization (requires mpv-sync.lua script)
# Uncomment ONE of the following lines to enable sync:
# NOTE: Using socat backend (lua-socket incompatible with MPV in Debian 13)
#script-opts=sync-backend=socat,sync-role=master,sync-target=10.30.70.255:12345,sync-interval=0.5,sync-show_osd=no
script=~/content/mpv-sync.lua
script-opts=sync-backend=socat,sync-role=follower,sync-target=10.30.70.255:12338,sync-initial_offset=0.015,sync-show_osd=no

#verbose=yes
